# Build upstream's runtime from scratch once, then install the workspace and
# run everything on every Node and CAP version the plugin declares: lint, the
# suite (ABI gates, auth, books, concurrency), the cold test, the bench, the
# consumer test - and the browser, once. Beside them, abap2UI5/protocol's
# backend conformance suite against this checkout (the job `conformance`).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "abap2UI5/abap2UI5 ref to build the runtime from (ignored when runtime_version is set)"
        default: "main"
      runtime_version:
        description: "@abap2ui5/node-runtime version to use instead of a build (published by abap2UI5 from its next release on)"
        default: ""

# Least privilege for the whole workflow. It matters here more than in most
# repositories: the job below checks out ANOTHER repository at a mutable branch
# and runs `npm ci` plus three build scripts from it, which is arbitrary code
# execution by whoever can push there. On `push: main` and on the schedule that
# code runs with a real GITHUB_TOKEN, not a fork PR's read-only one - so the
# token it runs with is the one thing this file can bound.
permissions:
  contents: read

jobs:
  # upstream's runtime, built once and handed to every leg of the matrix below
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # ---- upstream's runtime ---------------------------------------------
      # A SEPARATE checkout: `npm run auto_downport` rewrites src/ in place.
      #
      # `main` since abap2UI5#2772 merged (2026-09-20, e75cfd7). It used to be
      # the personal branch carrying the four seams, and that was a debt this
      # comment tracked - a debt that came due the moment the PR merged and
      # GitHub deleted the branch, because the checkout below would then have
      # resolved to nothing, or worse, to whatever was later pushed under that
      # name.
      - if: inputs.runtime_version == ''
        uses: actions/checkout@v4
        with:
          repository: abap2UI5/abap2UI5
          path: .upstream
          ref: ${{ inputs.upstream_ref || 'main' }}
          # The upstream build runs that repository's own scripts; do not leave
          # this job's credentials in .upstream/.git/config for them to read.
          persist-credentials: false
      - if: inputs.runtime_version == ''
        name: build the runtime
        working-directory: .upstream
        run: |
          npm ci
          npm run deps
          npm run auto_downport
          npm run auto_transpile
      - if: inputs.runtime_version == ''
        run: scripts/assemble-runtime.sh .upstream
      # Through the environment, not interpolated into the script text: a `${{ }}`
      # substitution lands in the shell before the shell parses it, so a value
      # carrying a quote would be command injection.
      - if: inputs.runtime_version != ''
        env:
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: scripts/assemble-runtime.sh --package "$RUNTIME_VERSION"
      # package.json too: --package replaces the stand-in's with the published one.
      # srv too: that manifest declares its entries there (srv/host.mjs, and
      # srv/accelerate.mjs from the release after 1.145.0), and the plugin
      # fails the start when a declared entry cannot be loaded - a manifest
      # without its srv/ would fail every job downstream.
      - uses: actions/upload-artifact@v7
        with:
          name: runtime
          path: |
            runtime/output
            runtime/setup
            runtime/downport
            runtime/srv
            runtime/package.json
          if-no-files-found: error
          retention-days: 1

  # The plugin declares @sap/cds >=9 and Node >=22, and what it declares is
  # tested - the way CAP's own plugins test `cds-version: [9, latest]` on the
  # Node versions CAP supports. `latest` is whatever npm calls latest today, so
  # the nightly run meets a new cds major before a user does. The workspace
  # itself pins the current major; a leg on another one sets it before the
  # install, for the example and for the consumer test alike.
  ci:
    needs: runtime
    name: ci (Node ${{ matrix.node }}, cds ${{ matrix.cds }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 22, cds: latest, sqlite: latest, browser: true }
          - { node: 24, cds: latest, sqlite: latest }
          - { node: 22, cds: 9, sqlite: 2 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v8
        with:
          name: runtime
          path: runtime

      # ---- the versions under test ------------------------------------------
      # Through the environment, not interpolated into the script text (see
      # above). @cap-js/sqlite follows the cds major: 2.x is the one for cds 9.
      - name: "@sap/cds ${{ matrix.cds }}"
        env:
          CDS: ${{ matrix.cds }}
          SQLITE: ${{ matrix.sqlite }}
        run: |
          spec() { [ "$1" = latest ] && echo latest || echo "^$1"; }
          npm pkg set "devDependencies.@sap/cds=$(spec "$CDS")"
          npm pkg set "dependencies.@sap/cds=$(spec "$CDS")" \
                      "dependencies.@cap-js/sqlite=$(spec "$SQLITE")" --workspace examples/bookshop

      # ---- the gates -------------------------------------------------------
      - run: npm install --no-audit --no-fund
      - name: Versions under test
        run: |
          node -p "['node ' + process.version,
            '@sap/cds ' + require('@sap/cds/package.json').version,
            '@cap-js/sqlite ' + require('@cap-js/sqlite/package.json').version].join(', ')"
      - run: npm run lint
      # the agent endpoint's vendored snapshot code against abap2UI5/mcp-server
      # at the commit it records (plugin/lib/agent/vendor/source.json, ADR-009)
      - run: npm run agent-vendor:check
      - run: npm test
      - run: npm run cold-test
      - run: npm run bench -- 50

      # Everything above runs inside the npm WORKSPACE, where
      # @cap2ui5/cds-plugin and @abap2ui5/node-runtime are symlinks - so a
      # broken `files`, a `main` pointing at nothing or a model contribution
      # that only resolves relatively cannot fail there, and all of them fail
      # on `npm i @cap2ui5/cds-plugin`. This packs both packages as publish
      # would and installs them into a throwaway CAP project. It is the only
      # step that answers "does the PACKAGE work".
      - run: npm run consumer-test

      # ---- the browser, once -------------------------------------------------
      - if: matrix.browser
        run: npx playwright install --with-deps chromium
        working-directory: examples/bookshop
      - if: matrix.browser
        run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: always() && matrix.browser
        with:
          name: screenshots
          path: examples/bookshop/screenshots
          if-no-files-found: ignore

  # abap2UI5/protocol's backend conformance suite against THIS checkout: the
  # protocol's own runner (scripts/run-conformance.mjs there) starts its
  # cap2UI5 host with the protocol's conformance apps, and
  # scripts/conformance.mjs points that host at this checkout's plugin and the
  # runtime built above, packed as publish packs them - nothing of the suite
  # is copied here. A failed MUST check fails the job; a SHOULD warns.
  #
  # The protocol is pinned to a commit of its main: its checks move with the
  # spec, and a new check should arrive here by a commit that bumps this SHA,
  # not overnight. The runtime is upstream's main (or the dispatched
  # version), so a framework fix shows here as soon as it merges.
  conformance:
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime
          path: runtime
      # The runner installs into this checkout's host directory and runs the
      # protocol's scripts - no credentials for them to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abap2UI5/protocol
          ref: d1251093e3cbdd9a44ac1a29770a2c1add0ec46b # main, 2026-10-03
          path: .protocol
          persist-credentials: false
      - run: npm run conformance -- .protocol --profile ui5 --json conformance.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: conformance
          path: conformance.json
          if-no-files-found: ignore
