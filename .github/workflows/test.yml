name: test

# Runs the CAP app's jest suite on every pull request (and on pushes to
# main — including the publish commits builder-cap2UI5 pushes here).
# Make this check "Required" in the branch protection rules of `main` so a
# PR can only be merged once the tests pass.
#
# Note: this repository is generated by cap2UI5/builder-cap2UI5 — do not
# hand-edit anything outside .github/ here; change builder-cap2UI5:src/
# instead.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # one install covers the app AND the vendored core/ (its deps are
      # part of the app lock, placed under core/node_modules/)
      - run: npm ci
      - run: npm test

  # Vulnerability check on the SHIPPED lock. Nothing audited it anywhere: the
  # builder audits its own dev dependencies, not the app tree it publishes,
  # and this repo had no audit at all -- so a known-vulnerable transitive
  # dependency of the deployed server could sit in the lock indefinitely.
  #
  # A separate job on purpose. It is advisory: `continue-on-error` keeps a new
  # advisory in a transitive dependency from blocking an unrelated PR, while
  # still showing up as a failed check somebody can act on. Raise it to a hard
  # gate once the baseline is clean and stays clean.
  #
  # (Lint is deliberately NOT here: the app's source is linted where it is
  # written, in builder-cap2UI5's own eslint run over src/srv and src/test.
  # Adding eslint to this generated repo would mean shipping a dev dependency
  # to every consumer to re-check code that was already checked.)
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: npm audit (production dependencies)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
