# Monthly, grouped: one pull request per ecosystem. The runtime's own
# dependencies (@abaplint/runtime, database-sqlite) are pinned by upstream's
# package and are not bumped here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      toolchain:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
